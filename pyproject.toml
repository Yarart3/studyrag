[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studyrag"
version = "0.1.0"
description = "Local RAG study assistant: ask questions, generate quizzes and summarize your PDF notes. Built with Ollama and ChromaDB."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Gerard Guarro Pérez", email = "gerardgurper@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]